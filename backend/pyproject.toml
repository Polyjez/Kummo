[project]
name = "kummo"
version = "0.1.0"
description = "Kummo API backend"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "fastapi[standard]>=0.115",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0",
    "supabase>=2.15",
]

# Operational tasks are plain console scripts so `uv run <name>` is the only
# entry point; no separate task runner is involved.
[project.scripts]
kummo-db-seed = "kummo.tasks:db_seed"
kummo-db-reset = "kummo.tasks:db_reset"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kummo"]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: needs a running local Supabase Postgres (deselect with -m 'not integration')",
]
